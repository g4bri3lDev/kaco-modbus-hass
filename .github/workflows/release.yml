name: Release Please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A GitHub release, not just a tag: HACS reads the latest *release* to
      # decide what version is available, and falls back to a commit hash
      # without one. release-please updates the version in manifest.json,
      # which is where a Home Assistant integration keeps it.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
