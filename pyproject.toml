# Tooling only. The integration itself is not a package: Home Assistant loads
# custom_components/kaco/ from disk.
[project]
name = "kaco-integration-dev"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "kaco-modbus==1.0.1",
    "modbus-connection[tmodbus]>=4.8.1,<5",
    "pytest-homeassistant-custom-component>=0.13",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Home Assistant loads custom_components/ from the config directory, so it is
# never installed as a package; put the repo root on the path instead.
pythonpath = ["."]
addopts = "--cov=custom_components.kaco --cov-report=term-missing"

[tool.coverage.report]
fail_under = 90

[tool.mypy]
strict = true
python_version = "3.14"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
